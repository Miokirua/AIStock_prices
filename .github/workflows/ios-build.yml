name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'chart/**'
      - 'table/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - '*.gradle.kts'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 构建 iOS 模拟器 App
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle 与 Kotlin/Native 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 写入 local.properties
        run: printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" > local.properties

      - name: 环境信息
        run: |
          java -version
          xcodebuild -version
          pod --version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

      - name: 生成 dummy framework（pod install 前置，跳过会导致运行时崩溃）
        run: ./gradlew :shared:generateDummyFramework --stacktrace

      - name: 安装 CocoaPods 依赖
        working-directory: iosApp
        run: pod install --verbose

      - name: xcodebuild 编译模拟器 App
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -300

      - name: 收集产物信息
        if: always()
        working-directory: iosApp
        run: |
          echo "=== 产物 ==="
          ls -la build/DerivedData/Build/Products/Debug-iphonesimulator/ 2>/dev/null || echo "未生成产物"
          du -sh build/DerivedData/Build/Products/Debug-iphonesimulator/*.app 2>/dev/null || true

      - name: 上传 .app 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-simulator-debug
          path: iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
          retention-days: 14
