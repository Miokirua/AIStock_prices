name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'chart/**'
      - 'table/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'buildSrc/**'
      - '*.gradle.kts'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 构建 iOS 模拟器 App
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle 与 Kotlin/Native 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 写入 local.properties
        run: printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" > local.properties

      - name: 环境信息
        run: |
          java -version
          xcodebuild -version
          pod --version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

      - name: 修正脚本执行权限
        run: |
          chmod +x gradlew || true
          ls -la gradlew

      - name: 生成 dummy framework（pod install 前置，跳过会导致运行时崩溃）
        run: ./gradlew :shared:generateDummyFramework --stacktrace

      - name: 安装 CocoaPods 依赖
        working-directory: iosApp
        run: pod install

      - name: 列出 Xcode scheme（诊断用）
        working-directory: iosApp
        run: xcodebuild -list -workspace iosApp.xcworkspace

      - name: xcodebuild 编译模拟器 App
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -200

      # 无 token 环境下无法下载 Actions 日志，故把关键错误回传为 check-run 注解（公开仓库匿名可读）
      - name: 回传编译错误为注解
        if: always()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if [ ! -f "$LOG" ]; then echo "未找到 xcodebuild 日志"; exit 0; fi
          echo "日志总行数: $(wc -l < "$LOG")"
          grep -nE "(error|fatal error|Error):" "$LOG" | grep -v "^$" | head -45 > "$RUNNER_TEMP/errs.txt" || true
          if [ -s "$RUNNER_TEMP/errs.txt" ]; then
            echo "=== 匹配到 $(wc -l < "$RUNNER_TEMP/errs.txt") 条错误 ==="
            while IFS= read -r l; do
              esc=$(printf '%s' "$l" | sed 's/%/%25/g; s/\r//g')
              echo "::error::$esc"
            done < "$RUNNER_TEMP/errs.txt"
          else
            echo "=== 未匹配到 error 行，回传尾部 60 行 ==="
            tail -60 "$LOG" | sed 's/%/%25/g; s/\r//g' | while IFS= read -r l; do
              echo "::warning::$l"
            done
          fi
          echo "=== 关键错误摘要（本地留档）==="
          tail -80 "$LOG"
          exit 0

      - name: 收集产物信息
        if: always()
        working-directory: iosApp
        run: |
          echo "=== 产物 ==="
          ls -la build/DerivedData/Build/Products/Debug-iphonesimulator/ 2>/dev/null || echo "未生成产物"
          du -sh build/DerivedData/Build/Products/Debug-iphonesimulator/*.app 2>/dev/null || true

      - name: 上传 .app 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-simulator-debug
          path: iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
          retention-days: 14
